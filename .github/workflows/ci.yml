name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare build tooling
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - name: Install wheel
        run: python -m pip install --no-index --find-links dist testvariance
      - name: Test installed package
        run: python -m unittest discover -s tests -v
      - name: Installed CLI smoke
        run: testvariance analyze examples/outcomes.jsonl --format text
      - name: Verify gate exit code
        shell: python
        run: |
          import subprocess
          result = subprocess.run(['testvariance', 'analyze', 'examples/outcomes.jsonl', '--fail-on-mixed'], capture_output=True)
          assert result.returncode == 1, (result.returncode, result.stderr)
